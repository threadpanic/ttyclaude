; ttyclaude configuration
; Location: $XDG_CONFIG_HOME/ttyclaude/config.ini
; Values: string, int, bool (true/false/yes/no/1/0), or empty
; API keys: literal, env:VARIABLE_NAME, or file:/path/to/keyfile

[general]
default_provider = echo
history_size = 100

[ui]
vim_mode = false
show_status_bar = true
markdown_theme = auto
code_theme = monokai

[debug]
verbose = false
log_level = info
log_file = 

; =============================================================================
; TIER 0: BUILT-IN (no network, no LLM)
; =============================================================================

[provider.echo]
delay_ms = 50

[provider.shell]
timeout = 30
allow_sudo = false

; =============================================================================
; TIER 1: LOCAL LLM (your hardware, real inference)
; =============================================================================

[provider.llamacpp]
endpoint = http://127.0.0.1:8080/completion
model_path = 
n_ctx = 4096
temperature = 0.7
stream = true
timeout = 300

; =============================================================================
; TIER 2: LOCAL ORCHESTRATORS (OpenAI-compatible wrappers)
; =============================================================================

[provider.lmstudio]
endpoint = http://127.0.0.1:1234/v1/chat/completions
model = local-model
max_tokens = 4096
temperature = 0.7
stream = true
timeout = 300

[provider.ollama]
endpoint = http://127.0.0.1:11434/api/generate
model = llama2
stream = true
timeout = 300

; =============================================================================
; TIER 3: CLOUD PROVIDERS (pay-per-token)
; =============================================================================

[provider.anthropic]
api_key = env:ANTHROPIC_API_KEY
model = claude-sonnet-4-20250514
max_tokens = 4096
temperature = 0.7
timeout = 90
proxy = 

[provider.openai]
api_key = env:OPENAI_API_KEY
endpoint = https://api.openai.com/v1/chat/completions
model = gpt-4
max_tokens = 4096
temperature = 0.7
stream = true
timeout = 90
proxy = 

[provider.mistral]
api_key = env:MISTRAL_API_KEY
endpoint = https://api.mistral.ai/v1/chat/completions
model = mistral-small-latest
max_tokens = 2048
temperature = 0.7
stream = true
timeout = 60
proxy =


