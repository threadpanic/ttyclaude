[package]
name = "ttyclaude2"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# TUI
ratatui = "0.25"
crossterm = "0.27"

# Markdown rendering
termimad = "0.23"
syntect = "5.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Config
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID
uuid = { version = "1.6", features = ["serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Byte utilities
bytes = "1.5"
